name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a pushed fix supersedes the queued run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # The bridge itself has no dependencies; this proves that stays true.
      - name: Assert no runtime dependencies
        run: node -e "const p=require('./package.json');const d=Object.keys(p.dependencies??{});if(d.length){console.error('Unexpected runtime deps:',d);process.exit(1)}console.log('no runtime dependencies')"

      - name: Syntax check every source file
        run: npm run check

      - name: Contract tests (no omp, no tmux)
        run: npm run test:ci

      - name: Attach pane-scraping unit tests
        run: npm run test:attach
